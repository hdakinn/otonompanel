# OtonomPanel — Home Assistant App tanımı
# Anahtarlar HA geliştirici belgesinden doğrulandı (developers.home-assistant.io/docs/apps/configuration,
# 19 ve 20 Kasım 2026). Sürüm her yayında artar; HA kullanıcıya "güncelleme var" der.
# homeassistant: en düşük HA sürümü. Panel yerleşimi ve lisansı HA'nın frontend/*_system_data komutlarıyla saklar;
# bu komutlar HA 2025.12.0'da geldi (homeassistant/components/frontend/storage.py, 2025.11.0'da yok).
# Beta (Doğan, 21 Kasım 2026): OtonomPanel beta olarak yayınlanır; mağazadaki adı ve kenar çubuğundaki adı "(Beta)"
# taşır, betadan çıkınca ikisinden de kaldırılır. İlk yayın 0.9.0 (Doğan'ın kararı); betadan çıkış 1.0.0.
name: OtonomPanel (Beta)
version: "0.9.2"
image: "ghcr.io/hdakinn/otonompanel"
slug: otonompanel
description: Tablet için kendiliğinden kurulan ev paneli (Lite ücretsiz, Pro yakında)
url: https://otonomev.com
homeassistant: "2025.12.0"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: Tablet paneli (tarayıcıda http://HA-ADRESİ:8098 açılır)
ingress: true
ingress_port: 8099
panel_icon: mdi:tablet-dashboard
panel_title: OtonomPanel (Beta)
watchdog: tcp://[HOST]:[PORT:8098]
options:
  ha_adresi: http://homeassistant:8123
  gunluk_seviyesi: info
schema:
  ha_adresi: url
  gunluk_seviyesi: list(debug|info|warning|error)
